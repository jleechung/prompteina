# TED dimers with text conditioning, for the binder alignment stage.
# Alignment grounding covers compactness, contact_order, sheet_topology,
# internal_symmetry and the cath_* properties (secondary structure within domain).
# Alignment head enabled — uses alignment index with bilateral grounding.
# Prerequisite: python scripts/data_acquisition/build_caption_index.py

datamodule:
  _target_: proteinfoundation.datasets.structure_data.StructureDataModule
  metadata_file: ${oc.env:DATA_PATH}/manifests/dimers.parquet
  base_dir: ${oc.env:DATA_PATH}
  batch_size: 2
  num_workers: 4
  train_split: 0.99
  path_column: path
  id_column: example_id
  pin_memory: true

  atomarray_transforms:
    - _target_: proteinfoundation.datasets.transforms.FilterProteinOnlyTransform

  atom37_transforms:
    - _target_: proteinfoundation.datasets.transforms.CoordsToNanometers
    - _target_: proteinfoundation.datasets.transforms.GlobalRotationTransform
    - _target_: proteinfoundation.datasets.transforms.CroppingTransform2
      crop_size: 500
      interface_threshold: 8.0
      dist_mode: "bb_ca"
      data_mode: "all-atom"
      binder_min_length: 1
      binder_max_length: 250
      binder_padding_length: 0
      target_min_length: 50
      target_spatial_crop_threshold: 15.0
      max_num_target_chains: -1
    - _target_: proteinfoundation.datasets.transforms.ContactTransform
      cutoff: 8.0
      min_perc: 0.0
      max_perc: 0.2
      contact_prob: 1.0
      contact_dropout_prob: 0.5
      hotspot_dropout_prob: 0.5
    - _target_: proteinfoundation.datasets.transforms.OpenFoldFrameTransform
    - _target_: proteinfoundation.datasets.transforms.ChainBreakPerResidueTransform
    - _target_: proteinfoundation.datasets.transforms.CenteringTransform
      center_mode: "target"
      data_mode: "all-atom"
    - _target_: proteinfoundation.datasets.transforms.ExtractTargetCoordinatesTransform
      compact_mode: true
    - _target_: proteinfoundation.datasets.transforms.FilterTargetResiduesTransform
    - _target_: proteinfoundation.datasets.transforms.AddTextFromCSV
      csv_path: ${oc.env:DATA_PATH}/captions/dimers.csv
      accession_column: accession
      text_column: description
      use_replicates: true
      load_alignments: true
      append_chain_to_key: true
      mmap_index: true
